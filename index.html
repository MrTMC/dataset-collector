<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12684F">
<title>Dataset Collector</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: app shell — sidebar on wide screens, top bar + bottom tab bar with a raised camera button on phones.
   The capture screen is one scroll: session → photo → object → category → filename + save at the very end. */
:root{
  --bg:#F1F4EF; --surface:#FFFFFF; --surface-2:#EDF1EA; --surface-3:#E3E9DF; --line:#D8DFD3; --fg:#14201A; --muted:#5A6A61;
  --accent:#12684F; --accent-hover:#0E5A44; --accent-ink:#FFFFFF; --accent-soft:#DAEEE4; --accent-line:#A9D5C1;
  --ok:#1C7340; --ok-soft:#DDF1E3; --warn:#94560A; --warn-soft:#FBEED8; --bad:#B42318; --bad-soft:#FCE4E1;
  --c-organik:#3F7D2A; --c-kertas:#9A6A2E; --c-plastik:#1F5FAD; --c-logam:#5C6772; --c-residu:#3A3A3A;
  --shadow-sm:0 1px 2px rgba(20,32,26,.06); --shadow:0 1px 2px rgba(20,32,26,.05),0 6px 20px rgba(20,32,26,.06);
  --shadow-lg:0 12px 40px rgba(20,32,26,.18);
  --f-ui:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:16px; --r-sm:11px; --r-xs:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1311; --surface:#131C19; --surface-2:#192420; --surface-3:#21302A; --line:#283732; --fg:#E5EEE9; --muted:#93A69D;
  --accent:#4CC3A3; --accent-hover:#63D0B2; --accent-ink:#052219; --accent-soft:#143A30; --accent-line:#24604F;
  --ok:#6FCF8E; --ok-soft:#163324; --warn:#EBAF55; --warn-soft:#3A2B12; --bad:#F2877C; --bad-soft:#3E1A16;
  --c-organik:#83C267; --c-kertas:#D7A76C; --c-plastik:#72A9F0; --c-logam:#AAB4BF; --c-residu:#C9CCCB;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1311; --surface:#131C19; --surface-2:#192420; --surface-3:#21302A; --line:#283732; --fg:#E5EEE9; --muted:#93A69D;
  --accent:#4CC3A3; --accent-hover:#63D0B2; --accent-ink:#052219; --accent-soft:#143A30; --accent-line:#24604F;
  --ok:#6FCF8E; --ok-soft:#163324; --warn:#EBAF55; --warn-soft:#3A2B12; --bad:#F2877C; --bad-soft:#3E1A16;
  --c-organik:#83C267; --c-kertas:#D7A76C; --c-plastik:#72A9F0; --c-logam:#AAB4BF; --c-residu:#C9CCCB;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.55rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.02rem;font-weight:750}
h3{font-size:.92rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.eyebrow{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;font-weight:750;color:var(--muted)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:22px 14px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.brand b{display:block;font-size:.95rem;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.brand span{font-size:.72rem;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--fg);text-decoration:none;font-weight:650;font-size:.93rem}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav a.cta{background:var(--accent);color:var(--accent-ink);margin-bottom:8px;justify-content:center;font-weight:750}
.nav a.cta:hover{background:var(--accent-hover)}
.nav a.cta[aria-current="page"]{box-shadow:0 0 0 3px var(--accent-soft)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--surface-2);text-decoration:none;color:var(--fg)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none;text-transform:uppercase}
.me .who{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.me .who b{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who span{font-size:.74rem;color:var(--muted)}
main{min-width:0;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:22px 48px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.topbar{display:none}
.tabbar{display:none}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.pagehead .t{display:flex;flex-direction:column;gap:3px;min-width:0}
.pagehead .t p{color:var(--muted);font-size:.9rem}
.projpick{display:flex;align-items:center;gap:8px}
.projpick select{width:auto;max-width:260px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:680;font-size:.9rem;cursor:pointer;text-decoration:none;color:var(--fg);white-space:nowrap;transition:background .12s,border-color .12s,transform .06s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:34px;padding:0 11px;font-size:.82rem;border-radius:9px}
.btn.lg{min-height:52px;padding:0 22px;font-size:1rem;border-radius:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn svg{width:18px;height:18px}
.iconbtn{width:42px;height:42px;padding:0;border-radius:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:.8rem;font-weight:680;color:var(--muted);min-width:0}
.field .hint{font-weight:500;font-size:.76rem}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--fg);font-size:.95rem;font-weight:550}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:68px;resize:vertical}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:680;font-size:.86rem;cursor:pointer;color:var(--muted);min-height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.seg button small{font-family:var(--f-mono);font-size:.7rem;font-weight:600;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm)}
.seg.inline{display:inline-flex}
.seg.inline button{flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:680;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow-sm)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card-h .lead{display:flex;align-items:center;gap:10px}
.step{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:.8rem;flex:none}
.step.done{background:var(--accent);color:var(--accent-ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.note{font-size:.85rem;padding:11px 13px;border-radius:11px;background:var(--surface-2);color:var(--muted)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.acc{background:var(--accent-soft);color:var(--accent)}
.note b{color:inherit}
hr.sep{border:0;border-top:1px solid var(--line);margin:0;width:100%}
dl.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:.84rem}
dl.kv dt{color:var(--muted);font-weight:600}
dl.kv dd{margin:0;word-break:break-word;font-variant-numeric:tabular-nums}
.cls{--c:var(--muted)}
.cls-organik{--c:var(--c-organik)} .cls-kertas{--c:var(--c-kertas)} .cls-plastik{--c:var(--c-plastik)} .cls-logam{--c:var(--c-logam)} .cls-residu{--c:var(--c-residu)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;display:inline-block;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.progress{height:8px;background:var(--surface-3);border-radius:4px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .2s}

/* ---------- dashboard ---------- */
.hero{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;padding:22px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.hero h2{font-size:1.25rem;font-weight:800}
.hero p{opacity:.88;font-size:.9rem}
.hero .progress{background:color-mix(in srgb,var(--accent-ink) 25%,transparent);width:min(440px,70vw);margin-top:6px}
.hero .progress span{background:var(--accent-ink)}
.hero .btn{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.hero .btn:hover{filter:brightness(.96)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0;box-shadow:var(--shadow-sm)}
.kpi b{font-size:1.75rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.15}
.kpi span{font-size:.78rem;color:var(--muted);font-weight:650}
.bars{display:flex;flex-direction:column;gap:13px}
.bar-row{display:grid;grid-template-columns:96px minmax(0,1fr) 120px;gap:12px;align-items:center;font-size:.87rem}
.bar-row .lbl{font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
.bar-row .lbl i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.track{position:relative;height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.track .fill{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:6px}
.track .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg);opacity:.45}
.bar-row .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
.bar-row .val b{color:var(--fg)}
table.t{width:100%;border-collapse:collapse;font-size:.86rem}
table.t th{text-align:left;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:750;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--surface-2)}
.tscroll{overflow-x:auto}
.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.issues li{display:flex;gap:10px;align-items:flex-start;font-size:.88rem}
.sev{width:4px;align-self:stretch;border-radius:2px;flex:none;background:var(--warn)}
.sev.bad{background:var(--bad)} .sev.ok{background:var(--ok)} .sev.info{background:var(--accent)}

/* ---------- capture ---------- */
.capture{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
.capture .col{display:flex;flex-direction:column;gap:16px;min-width:0}
.locwrap{position:relative}
.loctoken{font-family:var(--f-mono);font-weight:600;color:var(--fg)}
.whoami{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;background:var(--surface-2)}
.whoami .code{font-family:var(--f-mono);font-weight:700;font-size:1rem;color:var(--accent)}
.stage{position:relative;aspect-ratio:4/3;width:100%;max-width:100%;border-radius:14px;background:var(--surface-2);border:2px dashed var(--line);overflow:hidden;display:grid;place-items:center}
.stage.has{border:0;background:#0A0F0D}
.stage img.shot{width:100%;height:100%;object-fit:contain}
.stage .empty{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:22px}
.stage .bigcam{width:76px;height:76px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:0;cursor:pointer;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
.stage .bigcam svg{width:34px;height:34px}
.stage .badges{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap}
.stage .badges .chip{background:rgba(0,0,0,.62);color:#fff}
.stage .badges .chip.warn{background:#9A5800;color:#fff}
.stage.auto{aspect-ratio:auto;border-style:solid;border-width:1px;background:var(--ok-soft)}
.saved{display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:left;width:100%;padding:18px;min-width:0}
.saved .head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.saved .btn{white-space:normal;text-align:center;line-height:1.25;padding-block:10px}
.saved .ok-ic{width:44px;height:44px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.objchoice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.objbtn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:13px 14px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;min-height:74px}
.objbtn b{font-size:.95rem}
.objbtn span{font-size:.78rem;color:var(--muted)}
.objbtn .big{font-family:var(--f-mono);font-size:1.05rem;font-weight:700;color:var(--accent)}
.objbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.glist{display:flex;flex-direction:column;gap:7px;max-height:290px;overflow:auto;padding:2px}
.gitem{display:flex;gap:11px;align-items:center;padding:7px 9px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.gitem:hover{background:var(--surface-2)}
.gitem[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.gitem .th{width:48px;height:48px;border-radius:9px;background:var(--surface-3);overflow:hidden;flex:none;border-bottom:3px solid var(--c)}
.gitem .th img{width:100%;height:100%;object-fit:cover}
.gitem .gi{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.3}
.gitem .gi b{font-family:var(--f-mono);font-size:.95rem}
.gitem .gi span{font-size:.76rem;color:var(--muted)}
.clsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px}
.clsbtn{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:11px 12px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;min-height:68px}
.clsbtn b{font-weight:750;font-size:.93rem;display:flex;align-items:center;gap:8px;color:var(--fg)}
.clsbtn b i{width:11px;height:11px;border-radius:4px;background:var(--c)}
.clsbtn .conf{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.clsbtn .cbar{height:4px;width:100%;background:var(--surface-2);border-radius:2px;overflow:hidden}
.clsbtn .cbar span{display:block;height:100%;background:var(--c)}
.clsbtn[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 11%,var(--surface));box-shadow:inset 0 0 0 1px var(--c)}
.clsbtn .ai{position:absolute;right:9px;top:9px;font-size:.6rem;font-weight:800;letter-spacing:.07em;color:var(--accent);background:var(--accent-soft);padding:1px 5px;border-radius:5px}
.clsbtn[disabled]{opacity:.42;cursor:not-allowed}
.namecard{border:1.5px solid var(--accent-line);background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.fname{display:flex;flex-wrap:wrap;align-items:flex-start;gap:2px;font-family:var(--f-mono);font-size:1rem;row-gap:8px}
.fname .tok{display:flex;flex-direction:column;align-items:center;gap:2px}
.fname .tok code{font-family:inherit;padding:4px 7px;border-radius:7px;background:var(--surface);border:1px solid var(--line);font-weight:650}
.fname .tok.miss code{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.fname .tok.proj code{border-style:dashed;border-color:var(--accent)}
.fname .tok small{font-family:var(--f-ui);font-size:.6rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-weight:750}
.fname .sepc{padding-top:5px;color:var(--muted)}
.errs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--bad)}
.errs li::before{content:"• "}
.recent{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px}
.recent figure{margin:0;flex:none;width:120px;display:flex;flex-direction:column;gap:5px}
.recent figure .th{width:120px;height:90px;border-radius:10px;overflow:hidden;background:var(--surface-2)}

function drawScaled(src,maxDim){const w0=src.width,h0=src.height;const k=maxDim&&Math.max(w0,h0)>maxDim?maxDim/Math.max(w0,h0):1;const cv=document.createElement("canvas");cv.width=Math.round(w0*k);cv.height=Math.round(h0*k);const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(src,0,0,cv.width,cv.height);return cv}
function gray(src,w,h){const cv=document.createElement("canvas");cv.width=w;cv.height=h;const cx=cv.getContext("2d",{willReadFrequently:true});cx.drawImage(src,0,0,w,h);const d=cx.getImageData(0,0,w,h).data;const g=new Float32Array(w*h);for(let i=0;i<w*h;i++)g[i]=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];return g}
function dhash(src){const g=gray(src,9,8);let bits="";for(let y=0;y<8;y++)for(let x=0;x<8;x++)bits+=g[y*9+x]>g[y*9+x+1]?"1":"0";let hex="";for(let i=0;i<64;i+=4)hex+=parseInt(bits.slice(i,i+4),2).toString(16);return hex}
function blurScore(src){const w=320,h=Math.max(8,Math.round(src.height/src.width*320));const g=gray(src,w,h);let n=0,sum=0,sq=0;for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;const l=4*g[i]-g[i-1]-g[i+1]-g[i-w]-g[i+w];sum+=l;sq+=l*l;n++}const m=sum/n;return sq/n-m*m}


/* ---------- Supabase store ---------- */
class Store{
  constructor(c){this.c=c;this.urlCache=new Map();this.pend=new Map();this.subs=new Map();this.pt=null}
  async all(q){const out=[];for(let from=0;;from+=1000){const {data,error}=await q().range(from,from+999);if(error)throw error;out.push(...data);if(data.length<1000)break}return out}
  mapProject(r){return {...(r.data||{}),id:r.id,name:r.name,createdAt:r.created_at}}
  mapGroup(r){return {id:r.id,code:r.id,category:r.category,lastRep:r.last_rep,createdAt:r.created_at,updatedAt:r.updated_at}}
  mapImage(r){return {...(r.data||{}),id:r.id,group_id:r.group_id,object_code:r.group_id,filename:r.filename,repetition_number:r.repetition_number,verification_status:r.verification_status}}
  async rows(kind,pid){
    if(kind==="profiles")return await this.all(()=>this.c.from("profiles").select("user_id,username,full_name,role,photographer_code,active,created_at").order("created_at"));
    if(kind==="projects")return (await this.all(()=>this.c.from("projects").select("id,name,data,created_at").order("created_at"))).map(r=>this.mapProject(r));
    if(kind==="groups")return (await this.all(()=>this.c.from("object_groups").select("*").eq("project_id",pid).order("id"))).map(r=>this.mapGroup(r));
    if(kind==="images")return (await this.all(()=>this.c.from("images").select("id,group_id,filename,repetition_number,verification_status,data").eq("project_id",pid).order("created_at"))).map(r=>this.mapImage(r));
    if(kind==="counters"){const rs=await this.all(()=>this.c.from("counters").select("last_number").eq("project_id",pid));return [{id:"counter",last:rs[0]?rs[0].last_number:0}]}
    return [];
  }
  sub(kind,pid,cb){
    const key=kind+":"+(pid||"");let alive=true,cache=null,tmr=null,failed=false;
    const idOf=r=>r.id||r.user_id;
    const emit=()=>{if(alive&&cache)cb(Array.from(cache.values()))};
    const reload=async()=>{try{const rows=await this.rows(kind,pid);if(!alive)return;cache=new Map(rows.map(r=>[idOf(r),r]));failed=false;emit()}catch(e){console.warn(e);if(alive&&!failed){failed=true;toast("Gagal memuat data: "+errMsg(e),"bad")}}};
    const later=()=>{clearTimeout(tmr);tmr=setTimeout(reload,400)};
    const table={profiles:"profiles",projects:"projects",groups:"object_groups",images:"images",counters:"counters"}[kind];
    const opt={event:"*",schema:"public",table};if(pid)opt.filter="project_id=eq."+pid;
    const ch=this.c.channel("adc-"+key+"-"+uid()).on("postgres_changes",opt,pl=>{
      if(!cache)return later();
      if(kind==="images"){if(pl.eventType==="DELETE"&&pl.old&&pl.old.id){cache.delete(pl.old.id);emit()}else if(pl.new&&pl.new.data){const r=this.mapImage(pl.new);cache.set(r.id,r);emit()}else later()}
      else if(kind==="groups"&&pl.new&&pl.new.id&&pl.eventType!=="DELETE"){const r=this.mapGroup(pl.new);cache.set(r.id,r);emit()}
      else later();
    });
    ch.subscribe(st=>{if(st==="SUBSCRIBED"&&cache)later()});
    reload();
    const iv=setInterval(reload,120000);
    const vis=()=>{if(document.visibilityState==="visible")later()};document.addEventListener("visibilitychange",vis);window.addEventListener("online",later);
    this.subs.set(key,{reload,patch:r=>{if(cache){cache.set(idOf(r),r);emit()}}});
    return()=>{alive=false;clearInterval(iv);clearTimeout(tmr);document.removeEventListener("visibilitychange",vis);window.removeEventListener("online",later);try{this.c.removeChannel(ch)}catch{}this.subs.delete(key)};
  }
  refresh(kind,pid){this.subs.get(kind+":"+(pid||""))?.reload()}
  patchImage(r){this.subs.get("images:"+r.project_id)?.patch(r)}
  async rpc(fn,args){const {data,error}=await this.c.rpc(fn,args);if(error)throw error;return data}
  async saveImage(c){
    const path=c.pid+"/"+c.row.id+".jpg";
    const up=await this.c.storage.from("photos").upload(path,c.blob,{contentType:"image/jpeg",upsert:false});
    if(up.error)throw up.error;
    try{
      const row=await this.rpc("save_image",{p_project:c.pid,p_group:c.groupId,p_category:c.category,p_location:c.location,p_lighting:c.lighting,p_date:c.date,p_row:{...c.row,asset_id:path}});
      this.refresh("groups",c.pid);this.refresh("counters",c.pid);
      return row;
    }catch(e){await this.c.storage.from("photos").remove([path]).catch(()=>{});throw e}
  }
  async setStatus(pid,ids,status){for(let i=0;i<ids.length;i+=200)await this.rpc("set_status",{p_project:pid,p_ids:ids.slice(i,i+200),p_status:status});this.refresh("images",pid)}
  async relabelGroup(pid,gid,cat){await this.rpc("relabel_group",{p_project:pid,p_group:gid,p_category:cat});this.refresh("images",pid);this.refresh("groups",pid)}
  async deleteImage(pid,i){const asset=await this.rpc("delete_image",{p_project:pid,p_id:i.id});if(asset)await this.rmBlob(asset);this.refresh("images",pid)}
  async createProject(cfg){const id=await this.rpc("create_project",{p_name:cfg.name,p_data:cfg});this.refresh("projects");return id}
  async saveProject(pid,cfg){const {id,createdAt,...data}=cfg;const {error}=await this.c.from("projects").update({name:data.name,data,updated_at:new Date().toISOString()}).eq("id",pid);if(error)throw error}
  async deleteProject(pid){
    const b=this.c.storage.from("photos");
    for(;;){const {data,error}=await b.list(pid,{limit:100});if(error)throw error;if(!data||!data.length)break;const {error:e2}=await b.remove(data.map(f=>pid+"/"+f.name));if(e2)throw e2;if(data.length<100)break}
    const {error}=await this.c.from("projects").delete().eq("id",pid);if(error)throw error;this.refresh("projects");
  }
  async createUser(u){const id=await this.rpc("admin_create_user",{p_username:u.username,p_password:u.password,p_full_name:u.full_name,p_role:u.role,p_code:u.code});this.refresh("profiles");return id}
  async updateUser(id,u){await this.rpc("admin_update_user",{p_user:id,p_full_name:u.full_name,p_role:u.role,p_code:u.code,p_active:u.active});this.refresh("profiles")}
  async setPassword(id,pw){await this.rpc("admin_set_password",{p_user:id,p_password:pw})}
  async deleteUser(id){await this.rpc("admin_delete_user",{p_user:id});this.refresh("profiles")}
  url(id){
    const c=this.urlCache.get(id);if(c&&c.exp>Date.now())return Promise.resolve(c.url);
    return new Promise((res,rej)=>{const w=this.pend.get(id)||[];w.push({res,rej});this.pend.set(id,w);clearTimeout(this.pt);this.pt=setTimeout(()=>this.flushUrls(),30)});
  }
  async flushUrls(){
    const waiting=new Map(this.pend);this.pend.clear();const ids=[...waiting.keys()];
    for(let i=0;i<ids.length;i+=100){
      const chunk=ids.slice(i,i+100);let data=null,error=null;
      try{({data,error}=await this.c.storage.from("photos").createSignedUrls(chunk,3600))}catch(e){error=e}
      for(const p of chunk){const d=data&&data.find(x=>x.path===p);const ws=waiting.get(p)||[];if(d&&d.signedUrl){this.urlCache.set(p,{url:d.signedUrl,exp:Date.now()+3300e3});ws.forEach(x=>x.res(d.signedUrl))}else ws.forEach(x=>x.rej(error||new Error("Foto tidak ditemukan")))}
    }
  }
  async blob(id){const {data,error}=await this.c.storage.from("photos").download(id);if(error)throw error;return data}
  async rmBlob(id){if(id){try{await this.c.storage.from("photos").remove([id])}catch{}}}
}

/* ---------- stats ---------- */
function stats(){
  const cfg=S.project,imgs=S.images;
  const cats=(cfg.categories||[]).filter(c=>c.active!==false);
  const used=new Set(imgs.map(i=>i.group_id));
  const groups=S.groups.filter(g=>used.has(g.id));
  const perCat=cats.map(c=>({code:c.code,name:c.name,photos:imgs.filter(i=>i.category_confirmed===c.code).length,objects:groups.filter(g=>g.category===c.code).length}));
  const count=key=>{const m=new Map();for(const x of imgs){const k=x[key]||"–";m.set(k,(m.get(k)||0)+1)}return [...m.entries()].sort((a,b)=>b[1]-a[1])};
  return {total:imgs.length,objects:groups.length,pending:imgs.filter(i=>i.verification_status!=="verified").length,verified:imgs.filter(i=>i.verification_status==="verified").length,perCat,perLoc:count("location"),perPh:count("photographer_code")};
}
function fieldAccuracy(){const v=S.images.filter(i=>i.category_predicted&&i.verification_status==="verified");const ok=v.filter(i=>i.category_predicted===i.category_confirmed).length;return {n:v.length,acc:v.length?ok/v.length:null}}
function qualityIssues(){
  const out=[];
  const req=["location","lighting","photographer_code","capture_date","filename","asset_id","repetition_number","group_id","category_confirmed"];
  const incomplete=S.images.filter(i=>req.some(k=>i[k]==null||i[k]===""));
  if(incomplete.length)out.push({sev:"bad",text:`${incomplete.length} foto memiliki metadata wajib yang kosong.`});
  const badName=S.images.filter(i=>!FILENAME_RE.test(i.filename||""));
  if(badName.length)out.push({sev:"bad",text:`${badName.length} nama berkas tidak sesuai pola standar.`});
  const gmap=new Map(S.groups.map(g=>[g.id,g]));
  const incons=S.images.filter(i=>{const g=gmap.get(i.group_id);return g&&g.category!==i.category_confirmed});
  if(incons.length)out.push({sev:"bad",text:`${incons.length} foto berkategori berbeda dengan objeknya.`});
  const small=S.images.filter(i=>(i.quality_flags||[]).includes("kecil"));
  if(small.length)out.push({sev:"warn",text:`${small.length} foto berukuran kecil (sisi terpendek < 224 px).`});
  const blur=S.images.filter(i=>(i.quality_flags||[]).includes("buram"));
  if(blur.length)out.push({sev:"warn",text:`${blur.length} foto terdeteksi mungkin buram.`});
  let near=0;const arr=S.images.filter(i=>i.hash);
  if(arr.length<=1500){for(let a=0;a<arr.length;a++)for(let b=a+1;b<arr.length;b++){if(arr[a].group_id!==arr[b].group_id&&hamming(arr[a].hash,arr[b].hash)<=3)near++}}
  if(near)out.push({sev:"warn",text:`${near} pasang foto sangat mirip tetapi tercatat sebagai objek berbeda. Periksa apakah objek yang sama punya dua ID.`});
  const st=stats();const withP=st.perCat.filter(c=>c.photos>0);
  if(withP.length>=2){const mx=Math.max(...st.perCat.map(c=>c.photos)),mn=Math.min(...st.perCat.map(c=>c.photos));if(mn===0||mx/mn>1.5)out.push({sev:"warn",text:`Jumlah foto antar kategori belum seimbang (terbanyak ${mx}, tersedikit ${mn}).`})}
  {const f=fieldAccuracy();if(f.n>=10)out.push({sev:f.acc<0.7?"warn":"info",text:`Rekomendasi AI cocok dengan label final pada ${Math.round(f.acc*100)}% dari ${f.n} foto terverifikasi.`})}
  if(st.pending)out.push({sev:"info",text:`${st.pending} foto belum diverifikasi pemeriksa.`,filter:{status:"pending"}});
  return out;
}
function nameOfCode(code){const p=S.profiles.find(x=>x.photographer_code===code);return p?(p.full_name||p.username):""}

  </div>`;

function miniTable(rows,h,total){if(!rows.length)return '<p class="muted small">Belum ada data.</p>';return `<div class="tscroll"><table class="t"><thead><tr><th>${h}</th><th style="text-align:right">Foto</th><th style="text-align:right">Porsi</th></tr></thead><tbody>${rows.map(([k,n])=>`<tr><td>${esc(k)}</td><td style="text-align:right">${fmtInt(n)}</td><td style="text-align:right">${total?Math.round(n/total*100):0}%</td></tr>`).join("")}</tbody></table></div>`}

function camHTML(){
  const c=S.cam,g=selectedGroup();
  const title=g?`Objek ${g.code} · ulangan ${(g.lastRep||0)+1}`:S.draft.groupChoice==="new"?`Objek baru ${pad4(nextCode(S.groups,S.counter))}`:"Ambil foto";

  else if(c.state==="error")mid=`<div class="msg"><div class="stack" style="align-items:center;gap:14px;max-width:420px"><b style="font-size:1.05rem">Kamera langsung tidak dapat dibuka</b><span style="opacity:.85;font-size:.9rem">${esc(c.err)}</span>
    <button class="btn primary lg" data-act="nativeCam">${ICON.cam} Buka aplikasi kamera perangkat</button><button class="btn lg" data-act="pickLib" style="background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)">${ICON.img} Pilih dari galeri</button></div></div>`;
  return `<div class="cam" role="dialog" aria-modal="true" aria-label="Kamera">
    <video id="vid" autoplay playsinline muted ${c.state==="live"?"":"hidden"}></video>${c.state==="live"?'<div class="guide"><span>Letakkan objek di dalam kotak</span></div>':""}<div class="flash" id="flash"></div>${mid}
    <div class="bar"><button class="rb" data-act="closeCam" aria-label="Tutup kamera">${ICON.x}</button><b>${esc(title)}</b>${c.devices.length>1&&c.state==="live"?`<button class="rb" data-act="flip" aria-label="Ganti kamera">${ICON.flip}</button>`:'<span style="width:48px"></span>'}</div>
    ${c.state==="live"?`<div class="bot"><button class="rb" data-act="pickLib" aria-label="Pilih dari galeri" style="justify-self:start">${ICON.img}</button><button class="shutter" data-act="snap" aria-label="Ambil foto"></button><span></span></div>`:""}
  </div>`;
}
function renderCam(){const root=$("#camroot");if(!S.cam.open){root.innerHTML="";document.body.style.overflow="";return}root.innerHTML=camHTML();document.body.style.overflow="hidden";const v=$("#vid");if(v&&S.cam.stream&&v.srcObject!==S.cam.stream){v.srcObject=S.cam.stream;v.play().catch(()=>{})}}
async function openCamera(){
  const c=S.cam;c.open=true;c.err=null;
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){c.state="error";c.err=location.protocol!=="https:"&&!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)?"Kamera langsung butuh alamat HTTPS.":"Browser ini tidak mendukung kamera langsung.";renderCam();return}
  c.state="opening";renderCam();
  try{
    if(c.stream)c.stream.getTracks().forEach(t=>t.stop());
    c.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:c.facing},width:{ideal:1920},height:{ideal:1440}},audio:false});
    if(!c.open){c.stream.getTracks().forEach(t=>t.stop());c.stream=null;return}
    try{c.devices=(await navigator.mediaDevices.enumerateDevices()).filter(x=>x.kind==="videoinput")}catch{c.devices=[]}
    c.state="live";renderCam();
  }catch(e){
    c.stream=null;c.state="error";
    c.err=IS_PREVIEW||IS_ARTIFACT?"Pratinjau di Claude tidak diizinkan memakai kamera langsung. Di versi online (GitHub Pages), tombol ini langsung membuka kamera.":
      e&&e.name==="NotAllowedError"?"Izin kamera ditolak. Izinkan kamera untuk situs ini di pengaturan browser, lalu coba lagi.":
      e&&e.name==="NotFoundError"?"Tidak ada kamera yang terdeteksi di perangkat ini.":"Kamera sedang dipakai aplikasi lain atau tidak dapat diakses.";
    renderCam();
  }
}
function stopCamera(silent){const c=S.cam;if(c.stream)c.stream.getTracks().forEach(t=>t.stop());c.stream=null;c.open=false;c.state="idle";if(!silent||$("#camroot").innerHTML)renderCam()}
async function snap(){
  const v=$("#vid");if(!v||!v.videoWidth)return toast("Kamera belum siap.","bad");
  const f=$("#flash");if(f){f.classList.remove("on");void f.offsetWidth;f.classList.add("on")}
  const cv=document.createElement("canvas");cv.width=v.videoWidth;cv.height=v.videoHeight;cv.getContext("2d").drawImage(v,0,0);
  const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.95));
  setTimeout(()=>stopCamera(),180);
  await ingest(blob,null);
}
async function ingest(file,origName){
  try{
    const cfg=S.project,bmp=await loadBitmap(file),cv=drawScaled(bmp,+cfg.maxDim||0);
    const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",+cfg.jpegQuality||0.9));
    if(!blob)throw new Error("Konversi JPEG gagal.");
    const flags=[],bs=blurScore(cv);if(bs<45)flags.push("buram");if(Math.min(cv.width,cv.height)<224)flags.push("kecil");
    const hash=dhash(cv),d=S.draft;if(d.url)URL.revokeObjectURL(d.url);
    if(!d.groupChoice)d.groupChoice=S.groups.length?null:"new";
    Object.assign(d,{blob,url:URL.createObjectURL(blob),w:cv.width,h:cv.height,size:blob.size,blur:Math.round(bs),hash,flags,origName,ai:{status:"idle"},similar:null});
    let best=null;for(const i of S.images){if(!i.hash)continue;const dd=hamming(i.hash,hash);if(dd<=6&&(!best||dd<best.d))best={d:dd,filename:i.filename,code:i.object_code,group_id:i.group_id}}
    if(best&&best.group_id!==d.groupChoice)d.similar=best;
    S.lastSaved=null;renderCaptureParts();
    if(aiOn()&&!selectedGroup()&&(AI.state==="ready"||AI.state==="cached"||AI.state==="loading"))runAI();
  }catch(e){toast("Gambar tidak dapat diproses: "+(e.message||e),"bad")}
}
async function runAI(){
  const d=S.draft;if(!d.blob||!aiOn())return;
  const token=d.blob;d.ai={status:"running"};renderCategory();
  try{
    const r=await aiClassify(d.blob);if(S.draft.blob!==token)return;
    d.ai={status:"done",...r};
    if(!r.lowConf&&!d.category)d.category=r.category;
    let best=null;for(const i of S.images){if(!i.emb||i.emb_v!==AI_CFG.version)continue;const sim=dot(r.embVec,embDecode(i.emb,i.emb_scale));if(sim>=0.93&&(!best||sim>best.s))best={s:sim,filename:i.filename,code:i.object_code,group_id:i.group_id}}
    if(best&&best.group_id!==d.groupChoice&&!d.similar)d.similar=best;
  }catch(e){if(S.draft.blob!==token)return;d.ai={status:"error",message:(e&&e.message)||"Prediksi gagal."}}
  renderCategory();renderGroup();renderSavebar();
}
async function saveDraft(){
  if(S.busy)return;
  const d=S.draft,s=S.session,m=draftMeta(),pre=buildFilename(m,{categories:S.project.categories,lightings:lightsOf()});
  if(!d.blob||!pre.ok){renderSavebar();return toast("Lengkapi data yang ditandai merah sebelum menyimpan.","bad")}
  S.busy=true;renderSavebar();
  const isNew=d.groupChoice==="new",ai=d.ai.status==="done"?d.ai:null,now=new Date().toISOString();
  const row={id:uid(),category_predicted:ai?ai.category:null,ai_confidence:ai?Math.round(ai.confidence*1000)/1000:null,ai_alternatives:ai?ai.alternatives:[],ai_reason:ai?ai.reason:null,ai_model:ai?ai.model:null,ai_ms:ai?ai.ms:null,ai_knn_refs:ai?ai.knnRefs:null,emb:ai?ai.emb:null,emb_scale:ai?ai.embScale:null,emb_v:ai?AI_CFG.version:null,ai_status:d.ai.status==="error"?"gagal":ai?"selesai":"tidak dijalankan",
    category_source:!isNew?"objek":ai&&ai.category===m.category&&!ai.lowConf?"ai_dikonfirmasi":ai?"koreksi_manual":"manual",
    captured_at:now,width:d.w,height:d.h,size_bytes:d.size,blur_score:d.blur,quality_flags:d.flags,hash:d.hash,original_name:d.origName||null,note:(d.note||"").trim(),label_updated_at:null};
  try{
    const saved=await S.store.saveImage({pid:S.pid,groupId:isNew?null:d.groupChoice,category:isNew?m.category:null,location:m.location,lighting:m.lighting,date:m.date,blob:d.blob,row});
    S.lastSaved=saved;S.recent.unshift(saved);S.store.patchImage(saved);
    const gsel=S.groups.find(g=>g.id===saved.group_id);if(gsel)gsel.lastRep=Math.max(gsel.lastRep||0,saved.repetition_number);
    else S.groups.push({id:saved.group_id,code:saved.group_id,category:saved.category_confirmed,lastRep:saved.repetition_number,createdAt:now,updatedAt:now});
    if(isNew)S.counter=Math.max(S.counter,+saved.group_id);
    if(d.url)URL.revokeObjectURL(d.url);
    S.draft=newDraft(null);
    toast("Tersimpan: "+saved.filename,"ok");
  }catch(e){toast("Gagal menyimpan: "+errMsg(e)+" Foto belum tersimpan dan tidak ada nomor yang terpakai.","bad")}
  finally{S.busy=false;renderCaptureParts();const n=$("#d-note");if(n)n.value=S.draft.note;if(S.lastSaved)$("#cap-photo")?.scrollIntoView({behavior:"smooth",block:"start"})}
}

const CSV_COLS=["filename","file_path","split","category_confirmed","category_predicted","ai_confidence","category_source","object_code","repetition_number","location","lighting","photographer_code","capture_date","captured_at","width","height","size_bytes","blur_score","quality_flags","verification_status","reviewed_by","note","ai_model","ai_ms","ai_status","label_updated_at","created_by_username","id","project_id"];
function exportRows(){
  const o=S.exportOpts,sel=exportSelection();
  const sp=o.split?splitGroups(sel.groups,{train:+o.train||0,val:+o.val||0,test:+o.test||0},o.seed):null;
  const rows=sel.images.map(i=>{const split=sp?sp.get(i.group_id):"";return {...i,split,file_path:o.layout==="split"&&sp?`images/${split}/${i.category_confirmed}/${i.filename}`:`images/${i.filename}`}});
  return {rows,sel,sp};
}
function cleanRow(r){const {hash,asset_id,original_name,ai_alternatives,emb,emb_scale,emb_v,...rest}=r;return {...rest,ai_alternatives:(ai_alternatives||[]).map(a=>a.category+":"+a.confidence)}}
function summaryOf(rows,sp){
  const by=k=>rows.reduce((m,r)=>{const v=r[k]||"–";m[v]=(m[v]||0)+1;return m},{});
  const perCat={};for(const r of rows){const c=r.category_confirmed;perCat[c]=perCat[c]||{photos:0,objects:new Set()};perCat[c].photos++;perCat[c].objects.add(r.group_id)}
  const splits={};if(sp)for(const r of rows){splits[r.split]=splits[r.split]||{photos:0,objects:new Set()};splits[r.split].photos++;splits[r.split].objects.add(r.group_id)}
  const conv=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k,{photos:v.photos,objects:v.objects.size}]));
  return {project:{id:S.pid,name:S.project.name,description:S.project.description},generated_at:new Date().toISOString(),generated_by:S.me.username,scope:S.exportOpts.scope==="verified"?"terverifikasi":"semua",
    total_photos:rows.length,unique_objects:new Set(rows.map(r=>r.group_id)).size,per_category:conv(perCat),per_location:by("location"),per_lighting:by("lighting"),per_photographer:by("photographer_code"),
    split:sp?{method:"per ID objek fisik, stratifikasi per kategori",ratios:{train:+S.exportOpts.train,val:+S.exportOpts.val,test:+S.exportOpts.test},seed:S.exportOpts.seed,counts:conv(splits)}:null,
    naming:"<kelas>_<lokasi>_<cahaya>_<YYYYMMDD>_<fotografer>_<idobjek>_<ulangan>.jpg"};
}

Konvensi nama berkas

- dataset_summary.json         : ringkasan jumlah.
${sum.split?`- splits.csv                   : penempatan setiap ID objek ke train/val/test.

Pembagian data
Per ID objek fisik (bukan per foto), stratifikasi per kategori, seed "${sum.split.seed}", rasio ${sum.split.ratios.train}/${sum.split.ratios.val}/${sum.split.ratios.test}.
Semua foto dari satu objek berada di satu kelompok, sehingga tidak ada kebocoran antara data latih dan data uji.`:"Pembagian data: tidak disertakan pada ekspor ini."}
`;
}
async function offerFile(filename,data){
  try{
    if(S.downloads){await S.downloads.save({filename,data});return true}
    const blob=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true;
  }catch(e){if(e&&e.code==="declined")toast("Unduhan dibatalkan.");else toast("Unduhan gagal: "+errMsg(e),"bad");return false}
}
const slug=s=>String(s||"dataset").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"dataset";
async function ensureJSZip(){if(window.JSZip)return true;for(const src of ["vendor/jszip.min.js","https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"]){try{await loadScript(src);if(window.JSZip)return true}catch{}}return false}
async function exportZip(){
  if(!(await ensureJSZip()))return toast("Pustaka ZIP gagal dimuat. Periksa koneksi lalu coba lagi.","bad");
  S.exporting=true;const {rows,sel,sp}=exportRows();
  const setP=(n,t)=>{const el=$("#exportProgress");if(el)el.innerHTML=`<div class="stack" style="gap:6px"><div class="progress"><span style="width:${n}%"></span></div><span class="muted small">${esc(t)}</span></div>`};
  try{
    const zip=new JSZip(),root=zip.folder("dataset_export"),failed=[];let done=0;const queue=rows.slice();
    await Promise.all(Array.from({length:4},async()=>{while(queue.length){const r=queue.shift();try{root.file(r.file_path,await S.store.blob(r.asset_id))}catch{failed.push(r.filename)}done++;setP(Math.round(done/rows.length*85),`Mengambil foto ${done} dari ${rows.length}…`)}}));
    const ok=rows.filter(r=>!failed.includes(r.filename)),clean=ok.map(cleanRow);
    root.file("metadata.csv",toCSV(clean,CSV_COLS));root.file("metadata.json",JSON.stringify(clean,null,2));
    const sum=summaryOf(ok,sp);sum.missing_files=failed;root.file("dataset_summary.json",JSON.stringify(sum,null,2));
    if(sp)root.file("splits.csv",toCSV(sel.groups.map(g=>({object_code:g.code,category:g.category,split:sp.get(g.id),photos:ok.filter(r=>r.group_id===g.id).length})),["object_code","category","split","photos"]));
    root.file("README.txt",readmeOf(sum));
    setP(92,"Menyusun ZIP…");
    const blob=await zip.generateAsync({type:"blob",compression:"STORE"});
    setP(100,failed.length?`${failed.length} foto gagal diambil dan tidak disertakan.`:`Siap: ${ok.length} foto.`);
    await offerFile(`dataset_export_${slug(S.project.name)}_${ymd(new Date())}.zip`,blob);
  }catch(e){toast("Ekspor gagal: "+errMsg(e),"bad");setP(0,"Ekspor gagal.")}
  finally{S.exporting=false}
}

    <form id="f-newproj" class="addrow" style="grid-template-columns:minmax(0,1fr) auto"><label class="field">Nama proyek baru<input type="text" id="np-name" placeholder="mis. Dataset Sampah Gedung B"></label><button class="btn" type="submit">${ICON.plus} Buat proyek</button></form>
    <hr class="sep">
    <div class="row"><button class="btn danger" data-act="askDelProject">Hapus proyek “${esc(c.name)}”</button></div><div id="delProject"></div>
  </section>`;
}
function settingsUsers(){
  const users=S.profiles,codes=users.map(u=>u.photographer_code);
  const cred=S.newCred;
  return `<div class="grid2" style="align-items:start">
  <section class="card"><div class="card-h"><h2>Tambah pengguna</h2></div>
    ${cred?`<div class="note ok stack" style="gap:10px"><b>Akun ${esc(cred.username)} dibuat</b><span>Bagikan info masuk ini ke pengguna. Kata sandi tidak bisa dilihat lagi setelah halaman ini ditutup.</span><div class="cred" id="cred-text">${esc(credText(cred))}</div><div class="row"><button class="btn sm primary" data-act="copyCred">${ICON.copy} Salin info masuk</button><button class="btn sm ghost" data-act="dismissCred">Selesai</button></div></div>`:""}
    <form id="f-adduser" class="stack" autocomplete="off">
      <label class="field">Nama lengkap<input type="text" id="nu-name" required placeholder="mis. Budi Santoso"></label>
      <div class="grid2" style="gap:10px"><label class="field">Username<input type="text" id="nu-user" required autocapitalize="none" spellcheck="false" placeholder="mis. budi.santoso"></label>
      <label class="field">Kode fotografer<input type="text" id="nu-code" required value="${esc(nextPhotographerCode(codes))}" style="text-transform:uppercase;font-family:var(--f-mono)"></label></div>
      <div class="field"><span>Peran</span><div class="seg" role="group" id="nu-role">${["pengumpul","pemeriksa","admin"].map((r,i)=>`<button type="button" data-act="nuRole" data-v="${r}" aria-pressed="${(S.nuRole||"pengumpul")===r}">${ROLE_LABEL[r]}</button>`).join("")}</div><span class="hint">${esc(ROLE_DESC[S.nuRole||"pengumpul"])}</span></div>
      <label class="field">Kata sandi awal<div class="row" style="flex-wrap:nowrap"><input type="text" id="nu-pass" required minlength="8" value="${esc(S.nuPass||genPassword())}" style="font-family:var(--f-mono)"><button class="btn" type="button" data-act="genPw" aria-label="Buat kata sandi acak">${ICON.redo}</button></div><span class="hint">Minimal 8 karakter. Pengguna bisa menggantinya sendiri di Akun saya.</span></label>
      <button class="btn primary" type="submit" ${S.busy?"disabled":""}>${ICON.plus} Buat akun</button>
    </form></section>
  <section class="card"><div class="card-h"><h2>Pengguna</h2><span class="muted small">${users.filter(u=>u.active).length} aktif dari ${users.length}</span></div>
    <div class="users">${users.map(userRow).join("")}</div></section></div>`;
}
function genPassword(){const a="abcdefghjkmnpqrstuvwxyz23456789";let s="";const r=new Uint32Array(10);crypto.getRandomValues(r);for(const x of r)s+=a[x%a.length];S.nuPass=s.slice(0,5)+"-"+s.slice(5);return S.nuPass}
function credText(c){return `Dataset Collector\nAlamat  : ${location.origin+location.pathname}\nUsername: ${c.username}\nSandi   : ${c.password}\nPeran   : ${ROLE_LABEL[c.role]}`}
function userRow(u){
  const me=u.user_id===S.user.id,ed=S.editUser===u.user_id,pw=S.pwUser===u.user_id,del=S.delUser===u.user_id;
  return `<div class="user ${u.active?"":"off"}"><span class="avatar">${esc(initials(u))}</span>
    <div class="who"><b>${esc(u.full_name||u.username)}${me?' <span class="chip acc">Anda</span>':""}</b><span>@${esc(u.username)} · <span class="mono">${esc(u.photographer_code)}</span> · ${esc(ROLE_LABEL[u.role])}${u.active?"":" · nonaktif"}</span></div>
    <div class="acts"><button class="btn sm" data-act="editUser" data-v="${esc(u.user_id)}">Ubah</button><button class="btn sm ghost" data-act="pwUser" data-v="${esc(u.user_id)}">${ICON.key} Sandi</button>${me?"":`<button class="btn sm ghost danger" data-act="delUser" data-v="${esc(u.user_id)}">Hapus</button>`}</div>
    ${ed?`<div class="edit"><label class="field">Nama<input type="text" id="eu-name" value="${esc(u.full_name)}"></label><label class="field">Kode fotografer<input type="text" id="eu-code" value="${esc(u.photographer_code)}" style="text-transform:uppercase;font-family:var(--f-mono)"></label>
      <label class="field">Peran<select id="eu-role" ${me?"disabled":""}>${["pengumpul","pemeriksa","admin"].map(r=>`<option value="${r}" ${u.role===r?"selected":""}>${ROLE_LABEL[r]}</option>`).join("")}</select></label>
      <label class="field">Status<select id="eu-active" ${me?"disabled":""}><option value="1" ${u.active?"selected":""}>Aktif</option><option value="0" ${u.active?"":"selected"}>Nonaktif</option></select></label>
      <div class="row" style="grid-column:1/-1"><button class="btn sm primary" data-act="saveUser" data-v="${esc(u.user_id)}">Simpan</button><button class="btn sm ghost" data-act="editUser" data-v="">Batal</button><span class="muted small">Mengganti kode fotografer tidak mengubah nama berkas foto lama.</span></div></div>`:""}
    ${pw?`<div class="edit" style="grid-template-columns:minmax(0,1fr) auto"><label class="field">Kata sandi baru untuk ${esc(u.username)}<input type="text" id="pu-pass" minlength="8" value="${esc(genPassword())}" style="font-family:var(--f-mono)"></label><div class="row" style="align-self:end"><button class="btn sm primary" data-act="savePw" data-v="${esc(u.user_id)}">Atur sandi</button><button class="btn sm ghost" data-act="pwUser" data-v="">Batal</button></div></div>`:""}
    ${del?`<div class="edit" style="grid-template-columns:1fr"><p class="note bad">Hapus akun <b>${esc(u.username)}</b>? Pengguna tidak bisa masuk lagi. Foto yang sudah diambilnya tetap tersimpan. Untuk menghentikan akses sementara, pilih Ubah → Nonaktif.</p><div class="row"><button class="btn sm danger solid" data-act="doDelUser" data-v="${esc(u.user_id)}">Ya, hapus akun</button><button class="btn sm ghost" data-act="delUser" data-v="">Batal</button></div></div>`:""}
  </div>`;
}
function settingsAI(){if(!S.project)return `<p class="muted">Buat proyek terlebih dahulu.</p>`;return `<section class="card" id="ai-panel">${aiPanelHTML()}</section>`}
function settingsAccount(){
  const me=S.me;
  return `<div class="grid2" style="align-items:start">
  <section class="card"><div class="row" style="gap:14px"><span class="avatar" style="width:52px;height:52px;font-size:1.05rem">${esc(initials(me))}</span><div class="stack" style="gap:2px"><h2>${esc(me.full_name||me.username)}</h2><span class="muted small">@${esc(me.username)}</span></div></div>
    <dl class="kv"><dt>Peran</dt><dd>${esc(ROLE_LABEL[S.role])} — ${esc(ROLE_DESC[S.role])}</dd><dt>Kode fotografer</dt><dd class="mono">${esc(me.photographer_code)}</dd><dt>Foto saya</dt><dd>${fmtInt(S.images.filter(i=>i.photographer_code===me.photographer_code).length)} di proyek ini</dd></dl>
    <button class="btn danger" data-act="signOut" style="align-self:flex-start">${ICON.logout} Keluar</button></section>
  <section class="card"><h2>Ganti kata sandi</h2>
    <form id="f-mypw" class="stack">${pwField("my-pass","Kata sandi baru (minimal 8 karakter)","new-password")}${pwField("my-pass2","Ulangi kata sandi baru","new-password")}<button class="btn primary" type="submit" style="align-self:flex-start">Simpan kata sandi</button></form></section></div>`;
}
async function saveProject(patch){
  if(!S.project)return;const next={...S.project,...patch};S.project=next;S.projects=S.projects.map(p=>p.id===S.pid?next:p);
  try{await S.store.saveProject(S.pid,next)}catch(e){toast("Pengaturan gagal disimpan: "+errMsg(e),"bad")}
}
async function createProject(cfg){try{const pid=await S.store.createProject(cfg);ls.set("pid",pid);S.pid=null;toast("Proyek dibuat.","ok");if(S.route==="atur"){S.sub="proyek"}}catch(e){toast("Gagal membuat proyek: "+errMsg(e),"bad")}}
async function deleteProject(){const pid=S.pid,box=$("#delProject");if(box)box.innerHTML=`<p class="note">Menghapus proyek dan fotonya…</p>`;try{await S.store.deleteProject(pid);clearProject();ls.set("pid",null);toast("Proyek dihapus.","ok");go("beranda")}catch(e){toast("Penghapusan berhenti: "+errMsg(e),"bad")}}
async function addUser(){
  const name=$("#nu-name").value.trim(),u=normUser($("#nu-user").value),code=codeToken($("#nu-code").value),pw=$("#nu-pass").value,role=S.nuRole||"pengumpul";
  if(!USER_RE.test(u))return toast("Username 3–30 karakter: huruf kecil, angka, titik, garis bawah, atau strip.","bad");
  if(!/^[A-Z0-9]{2,10}$/.test(code))return toast("Kode fotografer 2–10 huruf besar atau angka, misalnya FA02.","bad");
  if(pw.length<8)return toast("Kata sandi minimal 8 karakter.","bad");
  S.busy=true;
  try{await S.store.createUser({username:u,password:pw,full_name:name,role,code});S.newCred={username:u,password:pw,role};S.nuPass=null;S.nuRole="pengumpul";toast(`Akun ${u} dibuat.`,"ok")}
  catch(e){toast(errMsg(e),"bad")}
  finally{S.busy=false;render()}
}
async function changeMyPassword(){
  const a=$("#my-pass").value,b=$("#my-pass2").value;
  if(a.length<8)return toast("Kata sandi minimal 8 karakter.","bad");if(a!==b)return toast("Kedua kata sandi tidak sama.","bad");
  try{const {error}=await S.sb.auth.updateUser({password:a});if(error)throw error;toast("Kata sandi diperbarui.","ok");$("#my-pass").value="";$("#my-pass2").value=""}catch(e){toast(errMsg(e),"bad")}
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const act=t.dataset.act,v=t.dataset.v;
  switch(act){
    case "togglePw":{S.showPw=!S.showPw;const vals={};document.querySelectorAll(".pw input").forEach(i=>{vals[i.id]=i.value});if(S.user&&!S.authView)render();else renderAuth();for(const [id,val] of Object.entries(vals)){const el=$("#"+id);if(el)el.value=val}break}
    case "openAccount":S.sub="akun";if(location.hash==="#atur"){e.preventDefault();render()}break;
    case "signOut":signOut();break;
    case "light":S.session.lighting=v;ls.set("light:"+S.pid,v);document.querySelectorAll("#light-seg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===v)));renderSavebar();break;
    case "openCam":openCamera();break;
    case "closeCam":stopCamera();break;
    case "flip":S.cam.facing=S.cam.facing==="environment"?"user":"environment";openCamera();break;
    case "snap":snap();break;
    case "nativeCam":stopCamera();$("#fileCam").click();break;
    case "pickLib":stopCamera(true);$("#fileLib").click();break;
    case "again":{const last=S.lastSaved;S.draft=newDraft(last?last.group_id:null);S.lastSaved=null;renderCaptureParts();openCamera();break}
    case "newObj":S.draft=newDraft("new");S.lastSaved=null;renderCaptureParts();openCamera();break;
    case "cat":S.draft.category=v;renderCategory();renderSavebar();break;
    case "runAI":runAI();break;
    case "aiDownload":aiDownload();break;
    case "aiLoad":aiLoad();break;
    case "aiRemove":aiRemove();break;
    case "aiBench":aiBenchmark();break;
    case "gnew":S.draft.groupChoice="new";renderGroup();renderCategory();renderSavebar();if(S.draft.blob&&aiOn()&&S.draft.ai.status==="idle"&&aiReady())runAI();break;
    case "gcont":{const q=$("#g-q");if(q){q.focus();q.scrollIntoView({block:"center",behavior:"smooth"})}else toast("Belum ada objek yang bisa difoto ulang. Pilih “Objek baru”.");break}
    case "gpick":S.draft.groupChoice=v;S.draft.similar=null;renderGroup();renderCategory();renderSavebar();break;
    case "copyName":{const n=t.dataset.name;if(!n)break;try{await navigator.clipboard.writeText(n);toast("Nama berkas disalin.")}catch{toast(n)}break}
    case "save":saveDraft();break;
    case "galFilter":try{S.gf={...S.gf,...JSON.parse(t.dataset.f)}}catch{}break;
    case "gfreset":S.gf={q:"",cat:"",loc:"",ph:"",date:"",code:"",status:""};render();break;
    case "galView":S.galView=v;ls.set("galView",v);render();break;
    case "bulkVerify":{const n=filteredImages().filter(i=>i.verification_status!=="verified").length;$("#bulkConfirm").innerHTML=`<div class="note warn row" style="justify-content:space-between"><span>Tandai ${n} foto yang tampil sebagai terverifikasi?</span><span class="row"><button class="btn sm primary" data-act="bulkYes">Ya, verifikasi</button><button class="btn sm" data-act="bulkNo">Batal</button></span></div>`;break}
    case "bulkYes":{const ids=filteredImages().filter(i=>i.verification_status!=="verified").map(i=>i.id);$("#bulkConfirm").innerHTML=`<p class="note">Memperbarui ${ids.length} foto…</p>`;await setStatus(ids,"verified");break}
    case "bulkNo":$("#bulkConfirm").innerHTML="";break;
    case "open":openDetail(v);break;
    case "close":closeModal();break;
    case "modalBg":if(e.target===t)closeModal();break;
    case "nav":{const x=filteredImages()[+v];if(x)openDetail(x.id);break}
    case "setStatus":await setStatus([S.modal.id],v);setTimeout(renderModal,200);break;
    case "editCat":S.modal.editCat=!S.modal.editCat;S.modal.confirmDel=false;renderModal();break;
    case "applyCat":{const i=S.images.find(x=>x.id===S.modal.id);if(i)changeGroupCategory(i.group_id,v);break}
    case "askDel":S.modal.confirmDel=!S.modal.confirmDel;S.modal.editCat=false;renderModal();break;
    case "doDel":{const id=S.modal.id,list=filteredImages(),ix=list.findIndex(x=>x.id===id),nx=list[ix+1]||list[ix-1];await deleteImage(id);if(nx)setTimeout(()=>openDetail(nx.id),200);else closeModal();break}
    case "eo":if(t.disabled)break;S.exportOpts[t.dataset.k]=v;ls.set("exportOpts2",S.exportOpts);render();break;
    case "exportZip":exportZip();break;
    case "exportCsv":exportMeta("csv");break;
    case "exportJson":exportMeta("json");break;
    case "sub":S.sub=v;S.editUser=S.pwUser=S.delUser=null;render();break;
    case "nuRole":S.nuRole=v;S.nuPass=$("#nu-pass")?.value||S.nuPass;{const keep={n:$("#nu-name")?.value,u:$("#nu-user")?.value,c:$("#nu-code")?.value};render();if($("#nu-name")){$("#nu-name").value=keep.n||"";$("#nu-user").value=keep.u||"";$("#nu-code").value=keep.c||""}}break;
    case "genPw":{const el=$("#nu-pass");if(el)el.value=genPassword();break}
    case "copyCred":{const txt=credText(S.newCred);try{await navigator.clipboard.writeText(txt);toast("Info masuk disalin. Kirim lewat WhatsApp atau pesan pribadi.","ok")}catch{const r=document.createRange();r.selectNodeContents($("#cred-text"));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast("Teks sudah dipilih, salin dengan Ctrl+C atau tahan layar.")}break}
    case "dismissCred":S.newCred=null;render();break;
    case "editUser":S.editUser=v||null;S.pwUser=S.delUser=null;render();break;
    case "pwUser":S.pwUser=v||null;S.editUser=S.delUser=null;render();break;
    case "delUser":S.delUser=v||null;S.editUser=S.pwUser=null;render();break;
    case "saveUser":{try{await S.store.updateUser(v,{full_name:$("#eu-name").value.trim(),code:codeToken($("#eu-code").value),role:$("#eu-role").value,active:$("#eu-active").value==="1"});S.editUser=null;toast("Pengguna diperbarui.","ok");render()}catch(err){toast(errMsg(err),"bad")}break}
    case "savePw":{const pw=$("#pu-pass").value;if(pw.length<8)return toast("Kata sandi minimal 8 karakter.","bad");try{await S.store.setPassword(v,pw);const u=S.profiles.find(x=>x.user_id===v);S.pwUser=null;S.newCred={username:u.username,password:pw,role:u.role};S.sub="pengguna";toast("Kata sandi diatur ulang.","ok");render();window.scrollTo(0,0)}catch(err){toast(errMsg(err),"bad")}break}
    case "doDelUser":{try{await S.store.deleteUser(v);S.delUser=null;toast("Akun dihapus.","ok");render()}catch(err){toast(errMsg(err),"bad")}break}
    case "addCat":{const code=normLoc($("#n-cat-code").value),name=$("#n-cat-name").value.trim()||code;if(!code)return toast("Isi kode kategori (huruf kecil dan angka).","bad");if((S.project.categories||[]).some(c=>c.code===code))return toast("Kode kategori sudah ada.","bad");await saveProject({categories:[...(S.project.categories||[]),{code,name,desc:"",active:true}]});render();break}
    case "rmCat":{const cats=S.project.categories.slice();cats.splice(+v,1);await saveProject({categories:cats});render();break}
    case "addLight":{const code=normLoc($("#n-light-code").value);if(!code)return toast("Isi kode cahaya (huruf kecil dan angka).","bad");if(lightsOf().some(l=>l.code===code))return toast("Kode sudah ada.","bad");await saveProject({lightings:[...lightsOf(),{code,label:$("#n-light-label").value.trim()||code}]});render();break}
    case "rmLight":{const a=lightsOf().slice();a.splice(+v,1);await saveProject({lightings:a});render();break}
    case "askDelProject":$("#delProject").innerHTML=`<div class="note bad stack" style="gap:8px;margin-top:10px"><b>Hapus proyek “${esc(S.project.name)}”?</b><span>${S.images.length} foto, ${S.groups.length} objek, dan semua pengaturannya akan dihapus permanen. Unduh ZIP terlebih dahulu bila perlu.</span><div class="row"><button class="btn sm danger solid" data-act="doDelProject">Ya, hapus proyek</button><button class="btn sm" data-act="noDelProject">Batal</button></div></div>`;break;
    case "noDelProject":$("#delProject").innerHTML="";break;
    case "doDelProject":deleteProject();break;
  }
});
document.addEventListener("change",async e=>{
  const id=e.target.id,val=e.target.value;
  if(id==="fileCam"||id==="fileLib"){const f=e.target.files&&e.target.files[0];e.target.value="";if(f){if(S.route!=="ambil")go("ambil");ingest(f,f.name)}return}
  if(S.route==="ambil"){
    if(id==="s-loc"){S.session.location=val;ls.set("loc:"+S.pid,val);renderSavebar()}
    if(id==="s-date"){S.session.dateIso=val;renderSavebar()}
  }
  if(S.route==="galeri"){const map={"gf-cat":"cat","gf-loc":"loc","gf-ph":"ph","gf-date":"date","gf-status":"status"};if(map[id]){S.gf[map[id]]=val;render()}}
  if(S.route==="ekspor"){
    if(id==="eo-split"){S.exportOpts.split=e.target.checked;if(!e.target.checked)S.exportOpts.layout="flat"}
    if(["eo-train","eo-val","eo-test"].includes(id))S.exportOpts[id.slice(3)]=Math.max(0,Math.min(100,+val||0));
    if(id==="eo-seed")S.exportOpts.seed=val||"42";
    ls.set("exportOpts2",S.exportOpts);render();
  }
  if(S.route==="atur"&&S.project&&can("admin")){
    const pm={"p-name":["name",v=>v.trim()||"Proyek tanpa nama"],"p-desc":["description",v=>v],"p-status":["status",v=>v],"p-target":["targetPerCategory",v=>Math.max(0,+v||0)],"p-q":["jpegQuality",v=>+v],"p-dim":["maxDim",v=>+v],"p-ai":["aiMode",v=>v],"p-learn":["aiLearn",v=>v]};
    if(pm[id]){await saveProject({[pm[id][0]]:pm[id][1](val)});if(id==="p-ai"){if(val!=="off"&&AI.cached&&!AI.session)aiLoad();render()}toast("Tersimpan.")}
    if(e.target.dataset.cat!=null){const cats=S.project.categories.map(c=>({...c}));cats[+e.target.dataset.cat][e.target.dataset.k]=val;await saveProject({categories:cats});toast("Tersimpan.")}
    if(e.target.dataset.catact!=null){const cats=S.project.categories.map(c=>({...c}));cats[+e.target.dataset.catact].active=e.target.checked;await saveProject({categories:cats});render()}
  }
});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="s-loc"){S.session.location=e.target.value;const h=$("#loc-hint");if(h)h.innerHTML=locHint();clearTimeout(S._lt);S._lt=setTimeout(()=>{ls.set("loc:"+S.pid,S.session.location);renderSavebar()},150)}
  if(id==="d-note")S.draft.note=e.target.value;
  if(id==="g-q"){S.gq=e.target.value;const pos=e.target.selectionStart;renderGroup();const q=$("#g-q");if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch{}}}
  if(id==="nu-name"){const u=$("#nu-user");if(u&&(!u.dataset.touched))u.value=usernameFrom(e.target.value)}
  if(id==="nu-user")e.target.dataset.touched="1";
  if(id==="gf-q"||id==="gf-code"){S.gf[id==="gf-q"?"q":"code"]=e.target.value;clearTimeout(S._gt);S._gt=setTimeout(()=>{const pos=e.target.selectionStart;render();const el=$("#"+id);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch{}}},250)}
});
document.addEventListener("keydown",e=>{
  if(S.cam.open){if(e.key==="Escape")stopCamera();if((e.key===" "||e.key==="Enter")&&S.cam.state==="live"&&!e.target.closest("button")){e.preventDefault();snap()}return}
  if(S.modal){if(e.key==="Escape")closeModal();if(e.key==="ArrowRight"||e.key==="ArrowLeft"){const list=filteredImages(),ix=list.findIndex(x=>x.id===S.modal.id),nx=list[ix+(e.key==="ArrowRight"?1:-1)];if(nx)openDetail(nx.id)}}
});
document.addEventListener("paste",e=>{if(S.route!=="ambil")return;const it=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith("image/"));if(it){const f=it.getAsFile();if(f)ingest(f,"tempel")}});

boot();

</script>
